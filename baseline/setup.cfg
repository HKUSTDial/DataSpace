[metadata]
name = dataspace-agent
version = 0.1.0
description = Minimal terminal-style ReAct baseline for DataSpace
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    openai>=1.40.0
    Pillow>=10.0.0
    PyYAML>=6.0.0
    smolagents[docker]>=1.24,<2

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    dataspace-agent = dataspace_agent.cli:main
    dataspace-baselines = dataspace_baselines.cli:main
